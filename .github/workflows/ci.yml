name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project CopyStack.xcodeproj -scheme CopyStack -destination 'platform=macOS' test
      - run: ./install.sh --build-only
